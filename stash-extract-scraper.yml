name: "Stash Extract Scraper"

# Definitive scrape on the user's "Scrape With" action against a scene.
sceneByFragment:
  action: script
  script:
    - python3
    - scraper.py
    - fragment

# Search by free-text name (returns a ranked list for the user to pick).
sceneByName:
  action: script
  script:
    - python3
    - scraper.py
    - name

# After the user picks a search result, Stash invokes this to get the
# definitive scrape for the chosen candidate.
sceneByQueryFragment:
  action: script
  script:
    - python3
    - scraper.py
    - query

# Scrape by URL — used when a scene already has a URL set and the user
# triggers "Scrape from URL". Stash offers this scraper for any scene URL
# that CONTAINS one of the strings below (plain substring match, no
# wildcards). Keep patterns narrow: a catch-all like "http" claims every
# URL and shadows every other installed scraper.
#
# Patterns must also survive the Settings UI, which renders each one via
# `new URL("https://" + pattern)` with no error handling: a pattern that
# starts with "#" or ":" (empty host) throws and blanks the whole
# Metadata Providers page. So the delimiter prefixes are dropped here and
# the bare substrings still match the same URLs.
#
# The defaults cover the two URL shapes only this scraper understands:
#   "sx="             bridge-stamped record id (the "#sx=" fragment),
#                     written back on scrape apply
#   "13100/records/"  viewer deep-link (match the port to VIEWER_PORT if
#                     you changed it from the compose default)
#
# To also route source-page URLs through the bridge's /match/url matching,
# append your archive's domains, e.g.:
#   - "web.archive.org"
sceneByURL:
  - action: script
    url:
      - "sx="
      - "13100/records/"
    script:
      - python3
      - scraper.py
      - url
